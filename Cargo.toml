[package]
name = "tts-rs"
version = "0.1.0"
edition = "2021"

[workspace]
members = [
    "crates/epub",
]

[dependencies]
tts-epub = { path = "crates/epub" }
iced = { version = "0.13", features = ["tokio", "image"] }
any-tts = "0.1.3"
hound = "3.5"
rodio = "0.22"
rfd = "0.17"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
tracing = "0.1"
tracing-subscriber = "0.3"
