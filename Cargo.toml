[package]
name = "tts-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
iced = { version = "0.13", features = ["tokio", "image"] }
any-tts = "0.1.3"
epub = "2.1"
scraper = "0.27"
hound = "3.5"
rodio = "0.22"
rfd = "0.17"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
tracing = "0.1"
tracing-subscriber = "0.3"
